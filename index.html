<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي - شركة الهواري</title>
    <!-- استدعاء ملف التنسيق -->
    <link rel="stylesheet" href="robot-widget.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .welcome-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        p {
            color: #7f8c8d;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>مرحباً بك في موقع الهواري</h1>
        <p>المساعد الصوتي الذكي جاهز لمساعدتك. اضغط على أيقونة الروبوت في الأسفل وتحدث إليه مباشرة!</p>
    </div>

    <!-- استدعاء ملف الجافاسكريبت للروبوت -->
    <script src="ai-assistant.js" defer></script>
</body>
</html>
